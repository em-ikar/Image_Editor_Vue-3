<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Roboto', system-ui, sans-serif; background: #121212; color: rgba(255,255,255,.87); -webkit-font-smoothing: antialiased; }
    a { color: #90caf9; } a:hover { color: #bbdefb; }
    button { font-family: inherit; }
    button:disabled { opacity: .38; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #121212; overflow: hidden;">

  <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 20px; background: #212121; box-shadow: 0 2px 4px -1px rgba(0,0,0,.2), 0 4px 5px 0 rgba(0,0,0,.14), 0 1px 10px 0 rgba(0,0,0,.12); position: relative; z-index: 2;">
    <div style="width: 40px; height: 40px; border-radius: 8px; background: {{primary}}; color: #ffffff; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
    </div>
    <div style="font-size: 20px; font-weight: 500; letter-spacing: .15px;">Image Editor</div>
    <div style="flex-grow: 1;"></div>
    <button type="button" disabled style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,.38); background: transparent; color: rgba(255,255,255,.87); font-size: 14px; font-weight: 500; letter-spacing: 1.25px; text-transform: uppercase;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 3v6h6"></path></svg>
      Reset
    </button>
    <button type="button" disabled style="height: 44px; padding: 0 20px; display: flex; align-items: center; gap: 8px; border-radius: 4px; border: 0; background: rgba(255,255,255,.24); color: #ffffff; font-size: 14px; font-weight: 500; letter-spacing: 1.25px; text-transform: uppercase;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>
      Export
    </button>
  </header>

  <div style="flex-grow: 1; display: flex; min-height: 0;">
    <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 32px;">
      <div style="width: 680px; height: 420px; box-sizing: border-box; border: 2px dashed rgba(255,255,255,.28); border-radius: 12px; background: rgba(255,255,255,.03); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px;">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.08); color: #90caf9; display: flex; align-items: center; justify-content: center; margin-bottom: 8px;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M17 8l-5-5-5 5"></path><path d="M12 3v12"></path></svg>
        </div>
        <h1 style="margin: 0; font-size: 28px; font-weight: 400; letter-spacing: 0;">Drop an image here</h1>
        <p style="margin: 0; font-size: 16px; color: rgba(255,255,255,.7);">or choose a file from your computer</p>
        <a href="Main.dc.html" style="margin-top: 8px; height: 48px; padding: 0 24px; display: flex; align-items: center; gap: 10px; border-radius: 4px; background: {{primary}}; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: 1.25px; text-transform: uppercase; box-shadow: 0 3px 1px -2px rgba(0,0,0,.2), 0 2px 2px 0 rgba(0,0,0,.14), 0 1px 5px 0 rgba(0,0,0,.12);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
          Choose image
        </a>
        <p style="margin: 8px 0 0; font-size: 13px; color: rgba(255,255,255,.7);">JPG, PNG or WebP</p>
      </div>
    </main>

    <aside style="width: 380px; flex-shrink: 0; display: flex; flex-direction: column; background: #212121; border-left: 1px solid rgba(255,255,255,.12);">
      <div role="tablist" style="height: 56px; flex-shrink: 0; display: flex; border-bottom: 1px solid rgba(255,255,255,.12);">
        <button type="button" role="tab" disabled style="flex-grow: 1; flex-basis: 0; height: 56px; border: 0; background: transparent; color: rgba(255,255,255,.87); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; letter-spacing: 1.25px; text-transform: uppercase;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"></path><path d="M18 22V8a2 2 0 0 0-2-2H2"></path></svg>
          Crop
        </button>
        <button type="button" role="tab" disabled style="flex-grow: 1; flex-basis: 0; height: 56px; border: 0; background: transparent; color: rgba(255,255,255,.87); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; letter-spacing: 1.25px; text-transform: uppercase;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
          Adjust
        </button>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px; text-align: center;">
        <div style="font-size: 16px; font-weight: 500;">No image yet</div>
        <div style="font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.7);">Crop and adjustment tools appear once an image is loaded.</div>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"primary":{"editor":"color","default":"#1976D2","options":["#1976D2","#00796B","#6A1B9A","#C62828"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#1976D2' };
  }
}
</script>
</body>
</html>
